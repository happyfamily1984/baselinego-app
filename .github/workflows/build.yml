name: Build APK

# 푸시하면 APK 를 빌드해서 공개 릴리스(latest)에 올립니다.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SITE_URL: https://www.baselinego.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Launcher icon from site
        run: |
          pip install --quiet pillow
          python3 tools/make_icon.py "$SITE_URL" app/src/main/res B
      - name: Build APK
        run: |
          gradle --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk BaselineGo.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag -R "$GITHUB_REPOSITORY" 2>/dev/null || true
          gh release create latest BaselineGo.apk -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "BaselineGo 바로가기 앱" \
            --notes "BaselineGo.apk 를 받아 설치하세요. 아이콘을 누르면 휴대폰 기본 브라우저로 baselinego.com 이 열립니다."
